name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/site_data.json"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          # Pinned to match the version tested locally with `wrangler pages
          # dev` -- the action's own default silently fell back to 3.90.0
          # (a major version behind) when its preferred version couldn't be
          # fetched, which bundled Pages Functions differently and broke
          # /api/prs routing in production while working fine locally.
          wranglerVersion: "4.143.0"
          command: pages deploy dist --project-name=apple-health-dashboard
